name: Mobile EAS Preview Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target mobile platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

permissions:
  contents: read

jobs:
  eas-preview:
    name: EAS Preview (${{ inputs.platform }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and lint gate
        run: |
          pnpm --filter @shark/mobile typecheck
          pnpm --filter @shark/mobile lint

      - name: Trigger EAS preview build
        working-directory: apps/mobile
        run: eas build --platform ${{ inputs.platform }} --profile preview --non-interactive --no-wait
