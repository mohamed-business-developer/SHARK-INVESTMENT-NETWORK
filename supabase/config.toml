# SHARK Investment Network — Supabase Project Configuration
# Reference: docs/ARCHITECTURE.md, docs/DATABASE.md, docs/SECURITY.md

project_id = "shark-investment-network"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Hard cap at PostgREST gateway; repositories enforce <= 50 per page
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/seed_reference.sql", "./seed/seed_dev_fixtures.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[storage.buckets.public-assets]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.pitch-documents]
public = false
file_size_limit = "25MiB"
allowed_mime_types = [
  "application/pdf",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "image/png",
  "image/jpeg"
]

[storage.buckets.verification-documents]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/jpeg", "image/png"]

[auth]
enabled = true
site_url = "http://localhost:3000"
# Exact allowlisted redirect URLs only (wildcards prohibited per docs/SECURITY.md)
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "shark://auth/callback"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
